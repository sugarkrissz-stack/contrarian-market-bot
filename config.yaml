# ─── Contrarian Market Intelligence Bot — Configuration ───

symbols:
  primary:
    - BTCUSDC
    - BTCUSDT
  secondary:
    - ETHUSDC
    - ETHUSDT

# Fallback mapping: if a USDC pair lacks ratio endpoints, use USDT pair data
usdc_to_usdt_fallback:
  BTCUSDC: BTCUSDT
  ETHUSDC: ETHUSDT

# ─── Global Alert Limits & Deduplication ───
max_alerts_per_day: 2            # hard cap across ALL alert sources over the last 24 hours

cooldown:
  hours: 12                      # 12h per-symbol cooldown
  escalation_pct: 40             # re-alert only if score jumps >= 40%

# ─── Contrarian Long Thresholds (Retail Fear / Short Squeeze Setup) ───
contrarian_long:
  fg_max: 20                     # Fear & Greed index < 20 (Extreme Fear)
  funding_rate_low: -0.0000731   # 8h funding rate < -0.0000731 (~-8% APR). -5.475% APR fired on ETH ~1/3 of the time
  funding_apr_low: -8.0          # APR equivalent (kept in sync with funding_rate_low)
  basis_low_pct: -0.03           # basis % < -0.03% (vs baseline if enabled)
  oi_drop_4h_pct: 3.0            # 4h OI drop % >= 3.0% (i.e. delta <= -3.0%)
  retail_ls_max: 0.75            # absolute fallback, used only if retail_baseline.enabled is false
  whale_minus_retail_min: 0.35   # OR whale L/S - retail L/S >= 0.35

# ─── Contrarian Short Thresholds (Retail Euphoria / Long Trap Setup) ───
contrarian_short:
  fg_min: 80                     # Fear & Greed index > 80 (Extreme Greed)
  funding_rate_high: 0.00025     # 8h funding rate > 0.00025 (+0.025%, ~+27.38% APR)
  funding_apr_high: 27.375       # APR equivalent for reference/fallback
  basis_high_pct: 0.08           # basis % > 0.08% (vs baseline if enabled)
  oi_jump_4h_pct: 4.0            # 4h OI jump % >= 4.0% (i.e. delta >= +4.0%)
  retail_ls_min: 2.60            # absolute fallback, used only if retail_baseline.enabled is false
  retail_minus_whale_min: 0.80   # OR retail L/S - whale L/S >= 0.80

# ─── Market Shock / Liquidation Flush ───
# These describe a move that already happened, so by default they are CONTEXT, not entries:
#   context = shown in the brief and appended to a contrarian alert on the same asset (default)
#   alert   = also sent as their own alert (shares the global cap + its own sub-cap below)
#   off     = not evaluated
market_shock:
  mode: context
  cooldown_hours: 6              # per-asset cooldown, only used when mode: alert
  max_alerts_per_day: 1          # shock alerts per rolling 24h, only used when mode: alert
  price_move_1h_pct: 3.5         # |1h price move| >= 3.5%
  price_move_4h_pct: 4.5         # |4h price move| >= 4.5%
  price_move_24h_pct: 5.0        # |24h price move| >= 5.0%
  oi_flush_drop_pct: 5.0         # 1h or 4h drop in OI *contracts* >= 5.0% (USD OI is not used: it falls with price)
  capitulation_fg_max: 15        # Fear & Greed < 15
  capitulation_24h_drop_pct: -4.5 # AND 24h price drop <= -4.5%
  capitulation_oi_drop_pct: 3.0  # AND OI contracts down >= 3.0% (F&G alone stays <15 for weeks)

# Retail long/short ratio is judged against its own trailing median. On OKX it sits near
# 2.7-3.0 nearly all the time, so a fixed "> 2.60" test was true ~76% of the time.
# Retail counts as crowded when it is `dev` above (longs) / below (shorts) the median.
# With fewer than min_samples rows of history the retail arm is skipped (no guessing).
retail_baseline:
  enabled: true
  days: 7
  min_samples: 24
  dev: 0.30

# Basis is measured against each symbol's own normal level, not against zero.
# A USDT-margined perp sits around -0.05% vs its index almost all the time, so a fixed
# "basis < -0.03%" test is permanently true. With this on, basis_low_pct / basis_high_pct
# above mean "percentage points below / above the trailing median basis".
# With fewer than min_samples rows of history, the basis arm is skipped (no guessing).
basis_baseline:
  enabled: true
  days: 7                        # trailing window for the median
  min_samples: 24                # minimum history rows before a baseline is trusted

# Confluence: minimum conditions (of A, B, C) that must fire
confluence_min_conditions: 2

# ─── SEC EDGAR ───
sec_edgar:
  watchlist:
    - ticker: CRDO
      cik: "0001807794"
    - ticker: MSTR
      cik: "0001050446"
  rate_limit_rps: 5              # max requests per second
  lookback_days: 14              # inspect filings from last N days

# ─── SEC Form 4 Noise Filter ───
form4_filter:
  suppress_codes: ["F", "A", "M"]
  purchase_min_value: 50000            # Code P min $ to alert
  sale_min_value: 500000               # Code S non-10b5-1 min $
  sale_10b51_min_value: 2000000        # Code S 10b5-1 min $

# ─── Database ───
database:
  path: data/market_intel.db

# ─── Reports ───
reports:
  path: reports/latest_brief.md

# ─── Priority Badges ───
priority_badges:
  BTC: "[P1 - BTC]"
  ETH: "[P2 - ETH]"
  SEC: "[SEC]"
