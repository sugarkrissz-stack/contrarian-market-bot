# ─── Contrarian Market Intelligence Bot — Configuration ───

symbols:
  primary:
    - BTCUSDC
    - BTCUSDT
  secondary:
    - ETHUSDC
    - ETHUSDT

# Fallback mapping: if a USDC pair lacks ratio endpoints, use USDT pair data
usdc_to_usdt_fallback:
  BTCUSDC: BTCUSDT
  ETHUSDC: ETHUSDT

# ─── Global Alert Limits & Deduplication ───
max_alerts_per_day: 2            # hard cap over the last 24 hours (checked via alerts_log)

cooldown:
  hours: 12                      # 12h per-symbol cooldown
  escalation_pct: 40             # re-alert only if score jumps >= 40%
  max_alerts_per_day: 2          # fallback reference

# ─── Contrarian Long Thresholds (Retail Fear / Short Squeeze Setup) ───
contrarian_long:
  fg_max: 32                     # Fear & Greed index <= this
  oi_drop_4h_pct: 2.5            # 4h OI drop % >= this (i.e. delta <= -2.5%)
  funding_apr_low: 0.0           # funding APR < this
  basis_low_pct: -0.03           # basis % < this
  retail_ls_max: 1.10            # retail L/S ratio <= this
  whale_minus_retail_min: 0.35   # OR whale L/S - retail L/S >= this

# ─── Contrarian Short Thresholds (Retail Euphoria / Long Trap Setup) ───
contrarian_short:
  fg_min: 70                     # Fear & Greed index >= this
  oi_jump_4h_pct: 4.5            # 4h OI jump % >= this (i.e. delta >= +4.5%)
  funding_apr_high: 22.0         # funding APR > this
  basis_high_pct: 0.08           # basis % > this
  retail_ls_min: 2.40            # retail L/S ratio >= this
  retail_minus_whale_min: 0.80   # OR retail L/S - whale L/S >= this

# Confluence: minimum conditions (of A, B, C) that must fire
confluence_min_conditions: 2

# ─── SEC EDGAR ───
sec_edgar:
  watchlist:
    - ticker: CRDO
      cik: "0001807794"
    - ticker: MSTR
      cik: "0001050446"
  rate_limit_rps: 5              # max requests per second
  lookback_days: 14              # inspect filings from last N days

# ─── SEC Form 4 Noise Filter ───
form4_filter:
  suppress_codes: ["F", "A", "M"]
  purchase_min_value: 50000            # Code P min $ to alert
  sale_min_value: 500000               # Code S non-10b5-1 min $
  sale_10b51_min_value: 2000000        # Code S 10b5-1 min $

# ─── Database ───
database:
  path: data/market_intel.db

# ─── Reports ───
reports:
  path: reports/latest_brief.md

# ─── Priority Badges ───
priority_badges:
  BTC: "[P1 - BTC]"
  ETH: "[P2 - ETH]"
  SEC: "[SEC]"
