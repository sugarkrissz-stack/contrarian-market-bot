name: Contrarian Market Intelligence Bot

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test Telegram alert'
        type: boolean
        required: false
        default: false
      daily_brief:
        description: 'Send US Market Open Brief'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-market-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market intelligence collector and engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BINANCE_FAPI_BASE_URL: ${{ secrets.BINANCE_FAPI_BASE_URL }}
        run: |
          NY_HOUR=$(TZ="America/New_York" date +%-H)
          NY_MIN=$(TZ="America/New_York" date +%-M)
          NY_DOW=$(TZ="America/New_York" date +%u)
          NY_DATE=$(TZ="America/New_York" date +%F)
          NY_MINS=$((NY_HOUR * 60 + NY_MIN))
          LAST_BRIEF=$(cat reports/open_brief_sent.txt 2>/dev/null || true)
          echo "Current America/New_York time: $NY_HOUR:$NY_MIN (weekday index $NY_DOW), last open brief sent: ${LAST_BRIEF:-never}"

          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "Running test alert..."
            python main.py --test-alert
          elif [ "${{ inputs.daily_brief }}" = "true" ]; then
            echo "Workflow dispatch requested daily open brief. Running Daily Open Brief..."
            python main.py --daily-open-brief
            echo "Running standard scan..."
            python main.py
          elif [ "$NY_DOW" -le 5 ] && [ "$NY_MINS" -ge 560 ] && [ "$NY_MINS" -le 690 ] && [ "$LAST_BRIEF" != "$NY_DATE" ]; then
            # 09:20–11:30 ET on weekdays, once per day. GitHub starts scheduled runs late
            # or skips them, so a narrow window used to miss the brief entirely.
            echo "Open brief not yet sent for $NY_DATE and inside 09:20–11:30 ET window. Running Daily Open Brief..."
            python main.py --daily-open-brief
            echo "Running standard scan..."
            python main.py
          else
            echo "Running standard hourly contrarian scan..."
            python main.py
          fi

      - name: Commit and push updated database and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --staged --quiet; then
            echo "No changes to market intelligence artifacts."
          else
            git commit -m "chore: automated market intelligence update [skip ci]"
            git push origin main
          fi
