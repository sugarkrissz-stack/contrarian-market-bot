name: Contrarian Market Intelligence Bot

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test Telegram alert'
        type: boolean
        required: false
        default: false
      daily_brief:
        description: 'Send US Market Open Brief'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-market-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market intelligence collector and engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BINANCE_FAPI_BASE_URL: ${{ secrets.BINANCE_FAPI_BASE_URL }}
        run: |
          NY_HOUR=$(TZ="America/New_York" date +%-H)
          NY_MIN=$(TZ="America/New_York" date +%-M)
          NY_DOW=$(TZ="America/New_York" date +%u)
          echo "Current America/New_York time: $NY_HOUR:$NY_MIN (weekday index $NY_DOW)"

          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "Running test alert..."
            python main.py --test-alert
          elif [ "${{ inputs.daily_brief }}" = "true" ]; then
            echo "Workflow dispatch requested daily open brief. Running Daily Open Brief..."
            python main.py --daily-open-brief
          elif [ "$NY_DOW" -le 5 ] && [ "$NY_HOUR" -eq 9 ] && [ "$NY_MIN" -ge 20 ] && [ "$NY_MIN" -le 45 ]; then
            echo "Detected US Market Open window (09:20–09:45 ET). Running Daily Open Brief..."
            python main.py --daily-open-brief
          else
            echo "Running standard hourly contrarian scan..."
            python main.py
          fi

      - name: Commit and push updated database and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_intel.db reports/latest_brief.md reports/latest_open_brief.md
          if git diff --staged --quiet; then
            echo "No changes to market intelligence artifacts."
          else
            git commit -m "chore: automated market intelligence update [skip ci]"
            git push origin main
          fi
