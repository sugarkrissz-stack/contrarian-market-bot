# ─── Contrarian Market Intelligence Bot — Configuration ───

symbols:
  primary:
    - BTCUSDC
    - BTCUSDT
  secondary:
    - ETHUSDC
    - ETHUSDT

# Fallback mapping: if a USDC pair lacks ratio endpoints, use USDT pair data
usdc_to_usdt_fallback:
  BTCUSDC: BTCUSDT
  ETHUSDC: ETHUSDT

# ─── Global Alert Limits & Deduplication ───
max_alerts_per_day: 2            # hard cap over the last 24 hours (checked via alerts_log)

cooldown:
  hours: 12                      # 12h per-symbol cooldown
  escalation_pct: 40             # re-alert only if score jumps >= 40%
  max_alerts_per_day: 2          # fallback reference

# ─── Contrarian Long Thresholds (Retail Fear / Short Squeeze Setup) ───
contrarian_long:
  fg_max: 20                     # Fear & Greed index <= 20 (Extreme Fear)
  funding_apr_low: -8.0          # funding APR <= -8.0%
  basis_low_pct: -0.03           # basis % < -0.03%
  oi_drop_4h_pct: 3.0            # 4h OI drop % >= 3.0% (i.e. delta <= -3.0%)
  retail_ls_max: 1.10            # retail L/S ratio <= 1.10
  whale_minus_retail_min: 0.35   # OR whale L/S - retail L/S >= 0.35

# ─── Contrarian Short Thresholds (Retail Euphoria / Long Trap Setup) ───
contrarian_short:
  fg_min: 80                     # Fear & Greed index >= 80 (Extreme Greed)
  funding_apr_high: 20.0         # funding APR >= +20.0%
  basis_high_pct: 0.08           # basis % > 0.08%
  oi_jump_4h_pct: 4.0            # 4h OI jump % >= 4.0% (i.e. delta >= +4.0%)
  retail_ls_min: 2.40            # retail L/S ratio >= 2.40
  retail_minus_whale_min: 0.80   # OR retail L/S - whale L/S >= 0.80

# Basis is measured against each symbol's own normal level, not against zero.
# A USDT-margined perp sits around -0.05% vs its index almost all the time, so a fixed
# "basis < -0.03%" test is permanently true. With this on, basis_low_pct / basis_high_pct
# above mean "percentage points below / above the trailing median basis".
# With fewer than min_samples rows of history, the basis arm is skipped (no guessing).
basis_baseline:
  enabled: true
  days: 7                        # trailing window for the median
  min_samples: 24                # minimum history rows before a baseline is trusted

# Confluence: minimum conditions (of A, B, C) that must fire
confluence_min_conditions: 2

# ─── SEC EDGAR ───
sec_edgar:
  watchlist:
    - ticker: CRDO
      cik: "0001807794"
    - ticker: MSTR
      cik: "0001050446"
  rate_limit_rps: 5              # max requests per second
  lookback_days: 14              # inspect filings from last N days

# ─── SEC Form 4 Noise Filter ───
form4_filter:
  suppress_codes: ["F", "A", "M"]
  purchase_min_value: 50000            # Code P min $ to alert
  sale_min_value: 500000               # Code S non-10b5-1 min $
  sale_10b51_min_value: 2000000        # Code S 10b5-1 min $

# ─── Database ───
database:
  path: data/market_intel.db

# ─── Reports ───
reports:
  path: reports/latest_brief.md

# ─── Priority Badges ───
priority_badges:
  BTC: "[P1 - BTC]"
  ETH: "[P2 - ETH]"
  SEC: "[SEC]"
